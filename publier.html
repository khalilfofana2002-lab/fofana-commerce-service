<!DOCTYPE html>

<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier une annonce | FCS</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #080808;
        color: white;
    }

    header {
        background: #111;
        padding: 20px;
        border-bottom: 1px solid #d4af37;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 15px;
    }

    header h1 {
        color: #d4af37;
        margin: 0;
    }

    header a {
        color: #d4af37;
        text-decoration: none;
    }

    .container {
        max-width: 750px;
        margin: 35px auto;
        padding: 25px;
        background: #151515;
        border: 1px solid #8f7523;
        border-radius: 12px;
    }

    h2 {
        color: #d4af37;
        text-align: center;
    }

    .intro {
        text-align: center;
        color: #ccc;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 18px;
        margin-bottom: 8px;
        color: #d4af37;
    }

    input, select, textarea {
        width: 100%;
        padding: 13px;
        border-radius: 6px;
        border: 1px solid #555;
        background: #080808;
        color: white;
        font-size: 16px;
    }

    textarea {
        min-height: 120px;
        resize: vertical;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 15px;
        background: #d4af37;
        color: #080808;
        border: none;
        border-radius: 6px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    .message {
        margin-top: 18px;
        text-align: center;
        line-height: 1.5;
    }

    .retour {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #d4af37;
        text-decoration: none;
    }
</style>

</head>

<body>

<header>
    <h1>FCS</h1>
    <a href="index.html">← Accueil</a>
</header>

<div class="container">

<h2>Publier une annonce</h2>

<p class="intro">
    Présentez votre produit et proposez-le aux utilisateurs de FCS.
</p>

<form id="formAnnonce">

    <label for="titre">Titre de l'annonce</label>
    <input
        type="text"
        id="titre"
        placeholder="Exemple : Vente de téléphone Samsung"
        required
    >

    <label for="categorie">Catégorie</label>
    <select id="categorie" required>
        <option value="">Choisir une catégorie</option>
        <option value="Électronique">Électronique</option>
        <option value="Véhicules">Véhicules</option>
        <option value="Immobilier">Immobilier</option>
        <option value="Mode">Mode et accessoires</option>
        <option value="Alimentation">Alimentation</option>
        <option value="Maison">Maison</option>
        <option value="Services">Services</option>
        <option value="Autres">Autres</option>
    </select>
<label for="type_offre">Type d'offre commerciale</label>

<select id="type_offre" required>
    <option value="">Choisir le type d'offre</option>
    <option value="Vente au détail">Vente au détail</option>
    <option value="Vente en gros">Vente en gros</option>
    <option value="Fournisseur">Fournisseur</option>
    <option value="Import-export">Import-export</option>
    <option value="Demande d'achat">Demande d'achat</option>
</select>
    <label for="description">Description</label>
    <textarea
        id="description"
        placeholder="Décrivez votre produit..."
        required
    ></textarea>

    <label for="photos">Photos du produit (facultatif)</label>

    <input
        type="file"
        id="photos"
        accept="image/*"
        multiple
    >

    <small style="color:#ccc; display:block; margin-top:8px;">
        Vous pouvez ajouter plusieurs photos. Cette étape est facultative.
    </small>

    <label for="prix">Prix (FCFA)</label>
    <input
        type="number"
        id="prix"
        min="0"
        step="1"
        placeholder="Exemple : 150000"
        required
    >

    <label for="ville">Ville</label>
    <input
        type="text"
        id="ville"
        placeholder="Exemple : Dakar"
        required
    >

    <label for="pays">Pays</label>
    <input
        type="text"
        id="pays"
        value="Sénégal"
        required
    >
    <label for="telephone">Numéro WhatsApp du vendeur</label>

<input
    type="tel"
    id="telephone"
    placeholder="Exemple : 77 123 45 67"
    required
>

<small style="color:#ccc; display:block; margin-top:8px;">
    Les acheteurs pourront vous contacter directement sur WhatsApp.
</small>
    <button type="submit" id="boutonPublier">
        Publier mon annonce
    </button>

    <div class="message" id="message"></div>

</form>

<a href="espace.html" class="retour">
    Retour à mon espace FCS
</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const supabaseClient = window.supabase.createClient(
        "https://ixetvhbkhboxfjlykclo.supabase.co",
        "sb_publishable_c0KiidatgOYE_0wFk3hy2Q_sWRSsxHZ"
    );

    const formulaire = document.getElementById("formAnnonce");
    const bouton = document.getElementById("boutonPublier");
    const message = document.getElementById("message");

    async function verifierConnexion() {
        const { data: { user }, error } =
            await supabaseClient.auth.getUser();

        if (error || !user) {
            window.location.href = "compte.html";
            return;
        }
    }

    verifierConnexion();

    formulaire.addEventListener("submit", async function(event) {
        event.preventDefault();

        bouton.disabled = true;
        bouton.textContent = "Publication en cours...";
        message.textContent = "";

        try {
            const { data: { user }, error: erreurUtilisateur } =
                await supabaseClient.auth.getUser();

            if (erreurUtilisateur || !user) {
                message.textContent =
                    "Vous devez être connecté pour publier une annonce.";

                window.location.href = "compte.html";
                return;
            }

            const titre = document.getElementById("titre").value.trim();
            const categorie = document.getElementById("categorie").value;
            const typeOffre = document.getElementById("type_offre").value;
            const description = document.getElementById("description").value.trim();
            const prix = Number(document.getElementById("prix").value);
            const ville = document.getElementById("ville").value.trim();
            const pays = document.getElementById("pays").value.trim();
            const telephone = document.getElementById("telephone").value.trim();

            if (!titre || !categorie || !description || !ville || !pays ||
    !telephone || !Number.isFinite(prix) || prix < 0) {

                message.textContent =
                    "Veuillez vérifier les informations de votre annonce.";

                return;
            }

            // Récupérer les photos sélectionnées
const photos = document.getElementById("photos").files;

// Limiter à 5 photos
if (photos.length > 5) {
    throw new Error("Vous pouvez ajouter 5 photos maximum.");
}

// Vérifier les fichiers
for (const photo of photos) {
    if (!photo.type.startsWith("image/")) {
        throw new Error("Seules les images sont acceptées.");
    }

    if (photo.size > 5 * 1024 * 1024) {
        throw new Error("Chaque photo doit faire 5 Mo maximum.");
    }
}

// Envoyer les photos vers Supabase
const liensPhotos = [];

for (const photo of photos) {

    const extension = photo.name.split(".").pop().toLowerCase();
    const nomFichier = user.id + "/" + crypto.randomUUID() + "." + extension;

    const { error: erreurPhoto } = await supabaseClient
        .storage
        .from("annonces")
        .upload(nomFichier, photo, {
            cacheControl: "3600",
            upsert: false
        });

    if (erreurPhoto) {
        throw erreurPhoto;
    }

    const { data: urlPhoto } = supabaseClient
        .storage
        .from("annonces")
        .getPublicUrl(nomFichier);

    liensPhotos.push(urlPhoto.publicUrl);
}

// Enregistrer l'annonce et les liens des photos
const { data, error } = await supabaseClient
    .from("listings")
    .insert({
        user_id: user.id,
        title: titre,
        category: categorie,
        offer_type: typeOffre,
        description: description,
        price: prix,
        currency: "XOF",
        city: ville,
country: pays,
seller_phone: telephone,
status: "published",
images: liensPhotos
    })
    .select()
    .single();

if (error) {
    throw error;
}

            message.textContent =
                "Votre annonce a été publiée avec succès sur FCS !";

            formulaire.reset();

        } catch (error) {
            console.error("Erreur de publication :", error);

            message.textContent =
                "Échec de la publication : " + error.message;

        } finally {
            bouton.disabled = false;
            bouton.textContent = "Publier mon annonce";
        }
    });
</script>

</body>
</html>
