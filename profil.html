<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon profil | FCS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #111;
    padding: 20px;
    border-bottom: 1px solid #d4af37;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    align-items: center;
}

header h1, h2 {
    color: #d4af37;
}

header a {
    color: #d4af37;
    text-decoration: none;
}

.container {
    max-width: 650px;
    margin: 40px auto;
    padding: 25px;
}

.profil {
    background: #151515;
    border: 1px solid #8f7523;
    border-radius: 12px;
    padding: 25px;
}

label {
    display: block;
    color: #d4af37;
    margin-top: 20px;
    margin-bottom: 8px;
}

input {
    width: 100%;
    padding: 13px;
    background: #080808;
    border: 1px solid #555;
    border-radius: 6px;
    color: white;
    font-size: 16px;
}

button {
    width: 100%;
    margin-top: 25px;
    padding: 14px;
    background: #d4af37;
    border: none;
    border-radius: 7px;
    font-weight: bold;
    cursor: pointer;
}

#message {
    text-align: center;
    margin-top: 18px;
    color: #d4af37;
}

footer {
    text-align: center;
    color: #999;
    padding: 25px;
}
</style>
</head>

<body>

<header>
    <h1>FCS</h1>
    <nav>
        <a href="index.html">Accueil</a> |
        <a href="espace.html">Mon espace</a>
    </nav>
</header>

<div class="container">

    <div class="profil">

        <h2>👤 Mon profil</h2>

        <p>Gérez vos informations personnelles sur FCS.</p>

<a href="commandes-vendeur.html"
   style="display:block; text-align:center; padding:14px; margin:20px 0; background:#d4af37; color:#080808; text-decoration:none; border-radius:7px; font-weight:bold;">
    📦 Mes commandes reçues
</a>

        <form id="formProfil">

            <label for="nom">Nom complet</label>
            <input type="text" id="nom" required>

            <label for="email">Adresse e-mail</label>
            <input type="email" id="email"
       placeholder="Entrez votre adresse email"
       required>

            <label for="telephone">Numéro de téléphone</label>
            <input type="tel" id="telephone">
           <hr style="border:1px solid #8f7523; margin:30px 0;">

<h2>🏢 Mon espace professionnel</h2>

<label for="account_type">Type de compte</label>
<select id="account_type">
    <option value="Particulier">Particulier</option>
    <option value="Vendeur professionnel">Vendeur professionnel</option>
    <option value="Fournisseur">Fournisseur</option>
    <option value="Entreprise">Entreprise</option>
</select>

<label for="business_name">Nom de l'entreprise ou boutique</label>
<input type="text" id="business_name" placeholder="Nom de votre entreprise">

<label for="business_description">Description de votre activité</label>
<textarea id="business_description"
    placeholder="Présentez votre entreprise et vos produits..."
    style="width:100%; min-height:100px; padding:13px; background:#080808; color:white; border:1px solid #555; border-radius:6px;"></textarea>

<label for="business_city">Ville de l'entreprise</label>
<input type="text" id="business_city" placeholder="Exemple : Dakar">
<label for="business_country">Pays de l'entreprise</label>
<input type="text" id="business_country" placeholder="Exemple : Sénégal">
 <hr style="border:1px solid #8f7523; margin:30px 0;">

<h2>🏪 Ma boutique FCS</h2>

<label for="store_name">Nom de la boutique</label>
<input type="text" id="store_name" placeholder="Nom de votre boutique">

<label for="store_description">Présentation de la boutique</label>
<textarea id="store_description"
    placeholder="Présentez votre activité..."
    style="width:100%; min-height:100px; padding:13px; background:#080808; color:white; border:1px solid #555; border-radius:6px;"></textarea>

<label for="store_city">Ville</label>
<input type="text" id="store_city" placeholder="Exemple : Dakar">

<label for="store_country">Pays</label>
<input type="text" id="store_country" placeholder="Exemple : Sénégal">

<label style="display:block; margin-top:15px;">
    <input type="checkbox" id="store_published">
    Publier ma boutique publiquement
</label>

<button type="button" id="saveStore">
    🏪 Enregistrer ma boutique
</button>
            <button type="submit" id="bouton">
                Enregistrer les modifications
            </button>

        </form>

        <p id="message"></p>

    </div>

</div>

<footer>
    FOFANA COMMERCE SERVICE — Le commerce sans frontières
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
    "https://ixetvhbkhboxfjlykclo.supabase.co",
    "sb_publishable_c0KiidatgOYE_0wFk3hy2Q_sWRSsxHZ"
);

const formulaire = document.getElementById("formProfil");
const message = document.getElementById("message");
const bouton = document.getElementById("bouton");

let utilisateur;

async function chargerProfil() {

    const { data: resultat, error: erreurConnexion } =
        await supabaseClient.auth.getUser();

    utilisateur = resultat.user;

    if (erreurConnexion || !utilisateur) {
        window.location.href = "compte.html";
        return;
    }

    document.getElementById("email").value =
        utilisateur.email || "";

    const { data, error } = await supabaseClient
        .from("profiles")
        .select("full_name, phone, account_type, business_name, business_description, business_city, business_country")
        .eq("id", utilisateur.id)
        .maybeSingle();

    if (error) {
        message.textContent = "Erreur : " + error.message;
        return;
    }

    if (data) {
        document.getElementById("nom").value =
            data.full_name || "";

        document.getElementById("telephone").value =
            data.phone || "";
            document.getElementById("account_type").value =
    data.account_type || "Particulier";

document.getElementById("business_name").value =
    data.business_name || "";

document.getElementById("business_description").value =
    data.business_description || "";

document.getElementById("business_city").value =
    data.business_city || "";

document.getElementById("business_country").value =
    data.business_country || "";
    } else {
        message.textContent =
            "Profil introuvable dans la base de données.";
    }
}

formulaire.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!utilisateur) return;

    bouton.disabled = true;
    bouton.textContent = "Enregistrement...";
    message.textContent = "";

    const nom = document.getElementById("nom").value.trim();
    const telephone = document.getElementById("telephone").value.trim();
      const accountType =
    document.getElementById("account_type").value;

const businessName =
    document.getElementById("business_name").value.trim();

const businessDescription =
    document.getElementById("business_description").value.trim();

const businessCity =
    document.getElementById("business_city").value.trim();

const businessCountry =
    document.getElementById("business_country").value.trim();
    if (!nom) {
        message.textContent = "Veuillez saisir votre nom.";
        bouton.disabled = false;
        bouton.textContent = "Enregistrer les modifications";
        return;
    }

    const { error } = await supabaseClient
        .from("profiles")
        .update({
    full_name: nom,
    phone: telephone,
    account_type: accountType,
    business_name: businessName,
    business_description: businessDescription,
    business_city: businessCity,
    business_country: businessCountry
})
        .eq("id", utilisateur.id);

    if (error) {
        message.textContent = "Erreur : " + error.message;
    } else {
        message.textContent =
            "Votre profil a été mis à jour avec succès !";
    }

    bouton.disabled = false;
    bouton.textContent = "Enregistrer les modifications";
});

chargerProfil();
const boutonBoutique = document.getElementById("saveStore");

boutonBoutique.addEventListener("click", async function () {

    const nomBoutique = document.getElementById("store_name").value.trim();
    const descriptionBoutique = document.getElementById("store_description").value.trim();
    const villeBoutique = document.getElementById("store_city").value.trim();
    const paysBoutique = document.getElementById("store_country").value.trim();
    const publication = document.getElementById("store_published").checked;

    if (!nomBoutique || !villeBoutique || !paysBoutique) {
        alert("Veuillez renseigner le nom, la ville et le pays.");
        return;
    }

    const { data: resultat, error: erreurConnexion } =
        await supabaseClient.auth.getUser();

    if (erreurConnexion || !resultat.user) {
        alert("Vous devez être connecté.");
        return;
    }

    const { error } = await supabaseClient
        .from("supplier_stores")
        .upsert({
            user_id: resultat.user.id,
            store_name: nomBoutique,
            description: descriptionBoutique,
            city: villeBoutique,
            country: paysBoutique,
            is_published: publication
        }, {
            onConflict: "user_id"
        });

    if (error) {
        alert("Erreur : " + error.message);
        return;
    }

    alert("Votre boutique a été enregistrée avec succès !");
});
</script>

</body>
</html>
