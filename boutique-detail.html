<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Boutique fournisseur | FCS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #111;
    padding: 25px;
    text-align: center;
    border-bottom: 2px solid #d4af37;
}

header h1 {
    color: #d4af37;
}

main {
    max-width: 1100px;
    margin: 30px auto;
    padding: 20px;
}

.boutique {
    background: #151515;
    border: 1px solid #8f7523;
    border-radius: 10px;
    padding: 25px;
    margin-bottom: 30px;
}

h2, h3 {
    color: #d4af37;
}

.produits {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 20px;
}

.produit {
    background: #151515;
    border: 1px solid #8f7523;
    border-radius: 10px;
    padding: 15px;
}

.produit img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 6px;
}

button {
    background: #d4af37;
    color: #080808;
    padding: 12px 20px;
    border: none;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
}

.message {
    color: #d4af37;
    text-align: center;
}
</style>
</head>

<body>

<header>
    <h1>FCS</h1>
    <p>Bienvenue dans la boutique du fournisseur</p>
</header>

<main>

    <section class="boutique">
        <h2 id="nomBoutique">Chargement...</h2>
        <p id="descriptionBoutique"></p>
        <p id="localisationBoutique"></p>
    </section>

    <h2>Produits et annonces du fournisseur</h2>

    <p class="message" id="message">Chargement des produits...</p>

    <section class="produits" id="listeProduits"></section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
    "https://ixetvhbkhboxfjlykclo.supabase.co",
    "sb_publishable_c0KiidatgOYE_0wFk3hy2Q_sWRSsxHZ"
);

const parametres = new URLSearchParams(window.location.search);
const vendeurId = parametres.get("id");

async function chargerBoutique() {

    const message = document.getElementById("message");

    if (!vendeurId) {
        message.textContent = "Identifiant du fournisseur manquant.";
        return;
    }

    const { data: boutique, error } = await supabaseClient
        .from("supplier_stores")
        .select("store_name, description, city, country")
        .eq("user_id", vendeurId)
        .eq("is_published", true)
        .maybeSingle();

    if (error || !boutique) {
        message.textContent = "Boutique introuvable ou non publiée.";
        return;
    }

    document.getElementById("nomBoutique").textContent =
        boutique.store_name;

    document.getElementById("descriptionBoutique").textContent =
        boutique.description || "Bienvenue dans notre boutique.";

    document.getElementById("localisationBoutique").textContent =
        "📍 " + boutique.city + ", " + boutique.country;

    await chargerProduits();
}

async function chargerProduits() {

    const liste = document.getElementById("listeProduits");
    const message = document.getElementById("message");

    const { data, error } = await supabaseClient
        .from("listings")
        .select("id, title, description, price, images, offer_type, category")
        .eq("user_id", vendeurId)
        .eq("status", "published")
        .order("created_at", { ascending: false });

    if (error) {
        message.textContent = "Erreur de chargement des produits.";
        return;
    }

    if (!data || data.length === 0) {
        message.textContent = "Ce fournisseur n'a pas encore publié de produits.";
        return;
    }

    message.textContent = "";

    data.forEach(produit => {

        const carte = document.createElement("article");
        carte.className = "produit";

        const titre = document.createElement("h3");
        titre.textContent = produit.title;

        const description = document.createElement("p");
        description.textContent = produit.description || "";

        const prix = document.createElement("p");
        prix.textContent = "Prix : " + (produit.price ?? "À consulter");

        const type = document.createElement("p");
        type.textContent = produit.offer_type || "Vente au détail";

        carte.append(titre, description, prix, type);

        if (Array.isArray(produit.images) && produit.images.length > 0) {
            const image = document.createElement("img");
            image.src = produit.images[0];
            image.alt = produit.title;
            carte.prepend(image);
        }

        liste.appendChild(carte);
    });
}

chargerBoutique();
</script>
</body>
</html>
