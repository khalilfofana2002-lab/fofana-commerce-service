<!DOCTYPE html>

<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Détails de l'annonce | FCS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    background: #111;
    padding: 20px;
    border-bottom: 1px solid #d4af37;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

header h1 {
    color: #d4af37;
}

header a {
    color: #d4af37;
    text-decoration: none;
    margin: 8px;
}

.container {
    max-width: 1000px;
    margin: 35px auto;
    padding: 20px;
}

.carte {
    background: #151515;
    border: 1px solid #8f7523;
    border-radius: 12px;
    overflow: hidden;
}

.galerie {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
    padding: 15px;
}

.galerie img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border-radius: 8px;
}

.contenu {
    padding: 25px;
}

h2, h3 {
    color: #d4af37;
}

.prix {
    color: #d4af37;
    font-size: 25px;
    font-weight: bold;
}

.description {
    line-height: 1.7;
    color: #ddd;
    white-space: pre-wrap;
}

.bouton {
    display: inline-block;
    background: #d4af37;
    color: black;
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
    font-weight: bold;
    margin: 8px 8px 8px 0;
    border: none;
    cursor: pointer;
}

.message {
    text-align: center;
    color: #ccc;
    padding: 30px;
}

footer {
    text-align: center;
    padding: 25px;
    color: #999;
    border-top: 1px solid #333;
    margin-top: 40px;
}
</style>

</head>

<body>

<header>
    <h1>FCS</h1>

<nav>
    <a href="index.html">Accueil</a>
    <a href="espace.html">Mon espace</a>
    <a href="compte.html">Connexion</a>
</nav>

</header>

<div class="container">

<p id="message" class="message">
    Chargement de l'annonce...
</p>

<div id="detailsAnnonce"></div>

</div>

<footer>
    FOFANA COMMERCE SERVICE — Le commerce sans frontières
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
    "https://ixetvhbkhboxfjlykclo.supabase.co",
    "sb_publishable_c0KiidatgOYE_0wFk3hy2Q_sWRSsxHZ"
);

const message = document.getElementById("message");
const details = document.getElementById("detailsAnnonce");

function securiser(texte) {
    return String(texte ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[c]);
}

async function chargerDetails() {

    const parametres = new URLSearchParams(window.location.search);
    const id = parametres.get("id");

    if (!id) {
        message.textContent = "Identifiant de l'annonce manquant.";
        return;
    }

    const { data: annonce, error } = await supabaseClient
        .from("listings")
        .select("*")
        .eq("id", id)
        .eq("status", "published")
        .maybeSingle();

    if (error || !annonce) {
        message.textContent = "Annonce introuvable ou indisponible.";
        return;
    }

 const telephoneVendeur = String(annonce.seller_phone || "")
    .replace(/\D/g, "");

const numeroWhatsApp = telephoneVendeur.startsWith("221")
    ? telephoneVendeur
    : "221" + telephoneVendeur;
    const photos = Array.isArray(annonce.images)
        ? annonce.images
        : [];

    const galerie = photos.length > 0
        ? photos.map(photo => `
            <img src="${securiser(photo)}" alt="Photo de l'annonce">
        `).join("")
        : `<p class="message">Aucune photo disponible.</p>`;
       
    message.textContent = "";

    details.innerHTML = `
        <article class="carte">

            <div class="galerie">
                ${galerie}
            </div>

            <div class="contenu">

                <h2>${securiser(annonce.title)}</h2>

                <p class="prix">
                    ${securiser(annonce.price)}
                    ${securiser(annonce.currency || "XOF")}
                </p>

                <h3>Description</h3>

                <p class="description">
                    ${securiser(annonce.description)}
                </p>

                <p>
                    <strong>Catégorie :</strong>
                    ${securiser(annonce.category)}
                </p>

                <p>
                    <strong>Localisation :</strong>
                    ${securiser(annonce.city)},
                    ${securiser(annonce.country)}
                </p>
                
    ${telephoneVendeur.length >= 9 ? `
    <a
        href="https://wa.me/${numeroWhatsApp}"
        class="bouton"
        target="_blank"
        rel="noopener noreferrer"
    >
        Contacter le vendeur sur WhatsApp
    </a>
` : `
    <p>Le vendeur n'a pas renseigné de numéro WhatsApp.</p>
`}
              <h3>Informations du vendeur</h3>

<p>
    <strong>Nom :</strong>
    ${securiser(vendeur?.full_name || "Vendeur FCS")}
</p>

<p>
    <strong>Téléphone :</strong>
    ${securiser(annonce.seller_phone || "Non renseigné")}
</p>
                <p>
                    <strong>Statut :</strong>
                    ${securiser(annonce.status)}
                </p>

                <a href="index.html" class="bouton">
                    Retour aux annonces
                </a>

            </div>

        </article>
    `;
}

chargerDetails();
</script>

</body>
</html>
